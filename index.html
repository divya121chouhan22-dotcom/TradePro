html<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradePro - Demo Trading</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  body{background:#0b0e11;color:white}
  .header{background:#1e2329;padding:15px;display:flex;justify-content:space-between;align-items:center}
  .logo{color:#f0b90b;font-weight:bold;font-size:22px}
  .balance{background:#2b3139;padding:8px 15px;border-radius:8px}
  .container{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
  .left{flex:2;min-width:300px;background:#1e2329;border-radius:10px;padding:15px}
  .right{flex:1;min-width:280px;background:#1e2329;border-radius:10px;padding:15px}
  .pairs{display:flex;gap:10px;overflow-x:auto;margin-bottom:15px}
  .pair{background:#2b3139;padding:10px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;border:2px solid transparent}
  .pair.active{border-color:#f0b90b}
  .green{color:#0ecb81}.red{color:#f6465d}
  #chart{width:100%;height:280px;background:#0b0e11;border-radius:8px;position:relative;overflow:hidden}
  .candle{position:absolute;bottom:0;width:14px}
  .trade-box input,.trade-box select{width:100%;padding:12px;margin:8px 0;background:#2b3139;border:none;color:white;border-radius:8px}
  .btn{width:48%;padding:15px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
  .buy{background:#0ecb81;color:white}.sell{background:#f6465d;color:white}
  .btns{display:flex;justify-content:space-between;margin-top:10px}
  .history{margin-top:15px;font-size:13px}
  .history div{padding:8px;border-bottom:1px solid #2b3139}
  .note{text-align:center;padding:10px;font-size:12px;color:#888}
</style>
</head>
<body>

<div class="header">
  <div class="logo">TradePro 💹</div>
  <div class="balance">Balance: $<span id="balance">10000</span> | P&L: <span id="pnl" class="green">$0</span></div>
</div>

<div class="container">
  <div class="left">
    <div class="pairs" id="pairs"></div>
    <h2 id="pairName">EUR/USD - <span class="green" id="price">1.0850</span></h2>
    <p style="color:#888;font-size:13px;margin:5px 0">Live Demo Chart - Real Money Nahi Hai</p>
    <canvas id="chart" width="600" height="280"></canvas>
  </div>

  <div class="right trade-box">
    <h3>Trade</h3>
    <label>Pair</label>
    <select id="pairSelect"><option>EUR/USD</option><option>GBP/USD</option><option>BTC/USD</option><option>GOLD</option></select>
    <label>Amount ($)</label>
    <input type="number" id="amount" value="100" placeholder="Amount">
    <label>Leverage</label>
    <select id="lev"><option>1:100</option><option>1:200</option><option>1:500</option></select>
    <div class="btns">
      <button class="btn buy" onclick="trade('BUY')">BUY ▲</button>
      <button class="btn sell" onclick="trade('SELL')">SELL ▼</button>
    </div>
    <div class="history" id="history"><b>Trade History</b><div>Abhi koi trade nahi hai</div></div>
  </div>
</div>

<p class="note">⚠️ Ye sirf Demo / College Project ke liye hai. Real trading ke liye SEBI regulated broker hi use karein.</p>

<script>
let balance = 10000, pnl = 0;
let pairs = [
  {name:"EUR/USD", price:1.0850},
  {name:"GBP/USD", price:1.2700},
  {name:"BTC/USD", price:67500},
  {name:"GOLD", price:2350}
];
let current = 0;
let historyData = [];

function renderPairs(){
  document.getElementById('pairs').innerHTML = pairs.map((p,i)=>`<div class="pair ${i==current?'active':''}" onclick="selectPair(${i})">${p.name}<br><b class="${Math.random()>0.5?'green':'red'}">${p.price}</b></div>`).join('');
}
function selectPair(i){ current=i; document.getElementById('pairName').innerHTML = pairs[i].name + ' - <span class="green">'+pairs[i].price+'</span>'; document.getElementById('pairSelect').value = pairs[i].name; renderPairs(); drawChart(); }
function trade(type){
  let amt = parseInt(document.getElementById('amount').value) || 100;
  if(amt > balance){ alert("Balance kam hai!"); return; }
  let profit = Math.floor(Math.random()*40 - 15);
  balance += profit; pnl += profit;
  document.getElementById('balance').innerText = balance;
  let pnlEl = document.getElementById('pnl'); pnlEl.innerText = "$"+pnl; pnlEl.className = pnl>=0?"green":"red";
  historyData.unshift(`${type} ${pairs[current].name} - $${amt} - ${profit>=0?'Profit +$'+profit:'Loss $'+profit}`);
  document.getElementById('history').innerHTML = "<b>Trade History</b>" + historyData.map(h=>`<div>${h}</div>`).join('');
  alert(type + " Trade Done! Result: " + (profit>=0?"Profit +$"+profit:"Loss $"+profit));
}
function drawChart(){
  let c = document.getElementById('chart'); let ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.beginPath(); ctx.strokeStyle="#f0b90b"; ctx.lineWidth=2;
  let y = 140;
  for(let x=0;x<=600;x+=20){ y += (Math.random()*30-15); ctx.lineTo(x,y); }
  ctx.stroke();
  ctx.fillStyle="#f0b90b"; ctx.fillText("DEMO CHART - LIVE", 10, 20);
}
setInterval(()=>{
  pairs.forEach(p=>{ p.price = (parseFloat(p.price) + (Math.random()*0.002-0.001)).toFixed(4); });
  renderPairs(); document.getElementById('price').innerText = pairs[current].price;
},2000);
renderPairs(); drawChart();
</script>
</body>
</html>
