
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradePro - Live Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e17;color:#fff;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 5px}
.logo{font-size:22px;font-weight:900;color:#00ff88}
.live{font-size:12px;background:#00ff88;color:#000;padding:5px 10px;border-radius:20px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#131a2a;border-radius:14px;padding:14px;border:1px solid #222}
.card h3{font-size:13px;color:#aaa}
.price{font-size:22px;font-weight:900;margin:6px 0}
.up{color:#00ff88}.down{color:#ff3b3b}
.small{font-size:11px;color:#888}
.buy{flex:1;background:#00c853;border:0;padding:10px;border-radius:8px;color:#fff;font-weight:800}
.sell{flex:1;background:#ff3b3b;border:0;padding:10px;border-radius:8px;color:#fff;font-weight:800}
.btns{display:flex;gap:10px;margin-top:10px}
</style>
</head>
<body>
<div class="top"><div class="logo">TradePro 📈</div><div class="live">● LIVE MARKET</div></div>
<p style="font-size:13px;color:#aaa">Indian + Forex + Crypto - Real Live (15 sec update)</p>
<div class="grid" id="grid"></div>
<div style="background:#131a2a;border-radius:14px;padding:12px;margin-top:12px">
<h3>Live Chart - NIFTY 50</h3>
<div id="tv" style="height:350px;margin-top:10px"></div>
</div>
<p id="status" style="text-align:center;font-size:12px;margin-top:12px;color:#aaa">Connecting...</p>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({"width":"100%","height":350,"symbol":"NSE:NIFTY","interval":"1","timezone":"Asia/Kolkata","theme":"dark","style":"1","locale":"in","container_id":"tv"});
let assets=[
{id:"NIFTY",name:"NIFTY 50 🇮🇳",price:24750,change:0.45},
{id:"SENSEX",name:"SENSEX 🇮🇳",price:81350,change:0.38},
{id:"BANKNIFTY",name:"BANK NIFTY 🇮🇳",price:51200,change:-0.12},
{id:"USDINR",name:"USD / INR 🇮🇳",price:83.52,change:0.05},
{id:"EURUSD",name:"EUR / USD 🌍",price:1.0850,change:0.12},
{id:"GBPUSD",name:"GBP / USD 🌍",price:1.2705,change:-0.08},
{id:"USDJPY",name:"USD / JPY 🌍",price:149.20,change:0.20},
{id:"BTC",name:"Bitcoin ₿",price:97500,change:1.20},
{id:"ETH",name:"Ethereum Ξ",price:3450,change:0.85},
{id:"GOLD",name:"Gold 🪙",price:2650,change:0.30},
];
function render(){
let html="";
assets.forEach(a=>{
let cls=a.change>=0?"up":"down";
let sign=a.change>=0?"+":"";
html+=`<div class="card"><h3>${a.name}</h3><div class="price">${a.price.toLocaleString('en-IN',{maximumFractionDigits:2})}</div><div class="${cls}">${sign}${a.change.toFixed(2)}%</div><div class="small">Live • ${new Date().toLocaleTimeString('en-IN')}</div><div class="btns"><button class="buy">BUY</button><button class="sell">SELL</button></div></div>`;
});
document.getElementById("grid").innerHTML=html;
}
render();
async function loadLive(){
try{
let r=await fetch("https://open.er-api.com/v6/latest/USD");
let d=await r.json();
if(d&&d.rates){
assets.find(x=>x.id=="USDINR").price=d.rates.INR;
assets.find(x=>x.id=="EURUSD").price=1/d.rates.EUR;
assets.find(x=>x.id=="GBPUSD").price=1/d.rates.GBP;
assets.find(x=>x.id=="USDJPY").price=d.rates.JPY;
}
let r2=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true");
let d2=await r2.json();
if(d2.bitcoin){assets.find(x=>x.id=="BTC").price=d2.bitcoin.usd;assets.find(x=>x.id=="BTC").change=d2.bitcoin.usd_24h_change;}
if(d2.ethereum){assets.find(x=>x.id=="ETH").price=d2.ethereum.usd;assets.find(x=>x.id=="ETH").change=d2.ethereum.usd_24h_change;}
let yurl="https://api.allorigins.win/get?url="+encodeURIComponent("https://query1.finance.yahoo.com/v7/finance/quote?symbols=%5ENSEI,%5EBSESN,%5ENSEBANK");
let r3=await fetch(yurl);
let d3=await r3.json();
let q=JSON.parse(d3.contents).quoteResponse.result;
q.forEach(item=>{
if(item.symbol=="^NSEI"){assets.find(x=>x.id=="NIFTY").price=item.regularMarketPrice;assets.find(x=>x.id=="NIFTY").change=item.regularMarketChangePercent;}
if(item.symbol=="^BSESN"){assets.find(x=>x.id=="SENSEX").price=item.regularMarketPrice;assets.find(x=>x.id=="SENSEX").change=item.regularMarketChangePercent;}
if(item.symbol=="^NSEBANK"){assets.find(x=>x.id=="BANKNIFTY").price=item.regularMarketPrice;assets.find(x=>x.id=="BANKNIFTY").change=item.regularMarketChangePercent;}
});
document.getElementById("status").innerHTML="✅ LIVE Connected • "+new Date().toLocaleTimeString('en-IN');
}catch(e){document.getElementById("status").innerHTML="⚠️ API slow hai, Demo chal raha hai";}
render();
}
loadLive();
setInterval(loadLive,15000);
</script>
</body>
</html>
